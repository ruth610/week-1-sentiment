data:
  raw_path: "data/raw/raw_analyst_ratings.csv"
  processed_path: "data/processed/cleaned_ratings.csv"
  price_path: "data/raw/yfinance_data" # Placeholder

analysis:
  headline_length_threshold: 10
  sentiment_model: "vader"
  stocks: ["AAPL", "MSFT", "GOOG", "AMZN", "TSLA", "META", "NVDA"] # Added for default

model:
  type: "random_forest"
  target_col: "Target"
  save_path: "models/sentiment_model.pkl"
  test_size: 0.2
  random_state: 42

logging:
  level: "INFO"
  file: "logs/app.log"
